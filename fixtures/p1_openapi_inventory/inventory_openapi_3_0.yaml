openapi: 3.0.4
info:
  title: Acme Warehouse Inventory API
  version: 1.0.0
servers:
  - url: https://api.inventory.acme.internal/v1
    description: Primary Warehouse Inventory API
components:
  securitySchemes:
    warehouse_bearer:
      type: http
      scheme: bearer
    partner_api_key:
      type: apiKey
      in: header
      name: X-Partner-Key
    tenant_query_key:
      type: apiKey
      in: query
      name: tenant_key
    legacy_cookie_auth:
      type: apiKey
      in: cookie
      name: session_id
  schemas:
    InventoryItem:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
        warehouse_zone:
          type: string
          nullable: true
    RecursiveCategory:
      type: object
      properties:
        name:
          type: string
        parent:
          $ref: "#/components/schemas/RecursiveCategory"
security:
  - warehouse_bearer: []
paths:
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Item path identifier
        schema:
          type: string
    get:
      operationId: inventory.get_item
      summary: Get Inventory Item
      parameters:
        - name: id
          in: query
          required: false
          description: Optional secondary correlation id in query string
          schema:
            type: string
        - name: tags
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      security:
        - warehouse_bearer: []
        - partner_api_key: []
          tenant_query_key: []
      responses:
        "200":
          description: Found inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /health:
    get:
      operationId: inventory.health_check
      summary: Public Health Check
      security:
        - {}
      responses:
        "200":
          description: Service healthy
  /categories/tree:
    get:
      operationId: inventory.get_category_tree
      summary: Get Recursive Category Tree (Cycle Test)
      responses:
        "200":
          description: Recursive category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecursiveCategory"
  /legacy/import:
    post:
      operationId: inventory.upload_csv
      summary: Upload Legacy CSV (Unsupported Multipart & Cookie Auth)
      security:
        - legacy_cookie_auth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        "202":
          description: Accepted
