[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spigot-docforge-mcp"
version = "0.1.0"
description = "MCP Bridge (The API to MCP): Local-first offline documentation-to-MCP compiler with evidence-backed extraction, deterministic code generation, and runtime policy enforcement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.0",
    "httpx==0.28.1",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "beautifulsoup4==4.15.0",
    "pypdf==6.19.0",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "packages/runtime", "packages/templates", "apps/api", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
managed = true
