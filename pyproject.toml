[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spigot-docforge-mcp"
version = "0.1.0"
description = "Spigot (DocForge MCP): Local-first offline documentation-to-MCP compiler with evidence-backed extraction, deterministic code generation, and runtime policy enforcement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.2.0",
    "jsonschema>=4.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "packages/runtime", "packages/templates", "apps/api", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
managed = true
