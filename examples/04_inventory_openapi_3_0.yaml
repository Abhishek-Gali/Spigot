openapi: 3.0.3
info:
  title: Warehouse Inventory Service API
  version: 1.0.0
  description: REST API for querying and updating warehouse stock levels.
servers:
  - url: https://api.inventory.internal/v1
    description: Production Warehouse API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    InventoryItem:
      type: object
      required:
        - sku
        - name
        - quantity
      properties:
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
paths:
  /items:
    get:
      operationId: listInventoryItems
      summary: List warehouse inventory items
      parameters:
        - name: warehouse_id
          in: query
          required: false
          schema:
            type: string
          description: Filter stock by warehouse code
      responses:
        "200":
          description: Inventory item list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      summary: Register a new inventory SKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItem"
      responses:
        "201":
          description: Created inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /items/{sku}:
    get:
      operationId: getInventoryItemBySku
      summary: Get stock level for a single SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
          description: Unique item SKU code
      responses:
        "200":
          description: Inventory item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
